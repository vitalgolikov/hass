fan_toilet1_control:

  #######################################################################
  # 🔘 ФЛАГ ПАУЗЫ АВТОМАТИКИ (уважать ручное выключение)
  #######################################################################
  input_boolean:
    toilet1_fan_pause:
      name: "Пауза автоматики вентиляции — Санузел 1"
      icon: mdi:pause-circle

  #######################################################################
  # 🕒 ТАЙМЕР РУЧНОЙ ВЕНТИЛЯЦИИ (45 мин)
  #######################################################################
  timer:
    toilet1_fan_timer:
      name: Вентиляция в санузле 1 отключится через
      duration: "00:45:00"

  #######################################################################
  # ⚙️  АВТОМАТИЗАЦИИ
  #######################################################################
  automation:

    ###################################################################
    # 1) Автовключение при повышенной влажности (>75%), если нет паузы
    ###################################################################
    - id: a_toilet1_fan_auto_on
      alias: "Авто: Вентиляция включена (влажность >75%) — С/У 1"
      initial_state: true
      mode: restart
      trigger:
        - platform: numeric_state
          entity_id: sensor.sanuzel1_humidity
          above: 75
          for: "00:01:00"
      condition:
        - condition: state
          entity_id: fan.sanuzel_1
          state: "off"
        - condition: state
          entity_id: input_boolean.toilet1_fan_pause
          state: "off"
        # тихие часы 22:30–00:01 — не включать автоматически (пакет fan_night_quiet.yaml)
        - condition: state
          entity_id: binary_sensor.fan_quiet_hours
          state: "off"
      action:
        - service: fan.turn_on
          target:
            entity_id: fan.sanuzel_1
        # если шёл ручной таймер — отменяем, автоматика взяла управление
        - service: timer.cancel
          target:
            entity_id: timer.toilet1_fan_timer

    ###################################################################
    # 2) Автовыключение при нормализации (<60%)
    ###################################################################
    - id: a_toilet1_fan_auto_off
      alias: "Авто: Вентиляция выключена (влажность <60%) — С/У 1"
      initial_state: true
      mode: restart
      trigger:
        - platform: numeric_state
          entity_id: sensor.sanuzel1_humidity
          below: 60
          for: "00:02:00"
      condition:
        - condition: state
          entity_id: fan.sanuzel_1
          state: "on"
      action:
        - service: fan.turn_off
          target:
            entity_id: fan.sanuzel_1

    ###################################################################
    # 3) Ручное включение вентиляции — старт таймера на 45 мин
    ###################################################################
    - id: a_toilet1_fan_manual_on
      alias: "Ручное включение вентиляции (45 мин) — С/У 1"
      initial_state: true
      mode: restart
      trigger:
        - platform: state
          entity_id: fan.sanuzel_1
          from: "off"
          to: "on"
      action:
        - service: timer.start
          target:
            entity_id: timer.toilet1_fan_timer
          data:
            duration: "00:45:00"

    ###################################################################
    # 4) Автовыключение по окончании ручного таймера
    ###################################################################
    - id: a_toilet1_fan_timer_off
      alias: "Таймер вентиляции истёк — С/У 1"
      initial_state: true
      mode: restart
      trigger:
        - platform: event
          event_type: timer.finished
          event_data:
            entity_id: timer.toilet1_fan_timer
      condition:
        - condition: state
          entity_id: fan.sanuzel_1
          state: "on"
      action:
        - service: fan.turn_off
          target:
            entity_id: fan.sanuzel_1

    ###################################################################
    # 5) Пауза автоматики на 15 мин при РУЧНОМ выключении при высокой влажности
    ###################################################################
    - id: a_toilet1_fan_pause_on
      alias: "Пауза автоматики (ручное выключение при >75%) — С/У 1"
      initial_state: true
      mode: restart
      trigger:
        - platform: state
          entity_id: fan.sanuzel_1
          from: "on"
          to: "off"
      condition:
        - condition: numeric_state
          entity_id: sensor.sanuzel1_humidity
          above: 75
      action:
        # если шёл ручной таймер — отменяем, раз пользователь выключил
        - service: timer.cancel
          target:
            entity_id: timer.toilet1_fan_timer
        # включаем паузу автоматики
        - service: input_boolean.turn_on
          target:
            entity_id: input_boolean.toilet1_fan_pause
        # пауза 15 минут, затем автоматике снова можно включать при >75%
        - delay: "00:15:00"
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.toilet1_fan_pause
