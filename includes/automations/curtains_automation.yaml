# Файл: curtains_automation.yaml
# Шторы управляются через cover.shtory_* (пакет includes/packages/curtains_covers.yaml).
# Состояние cover = концевик: open = штора открыта, closed = закрыта.
# Команда отправляется только если штора в противоположном положении.
# Резервная копия прежней версии: includes/automations_backup_curtains_automation.yaml.bak

# ====== КУХНЯ ======
- id: curtains_kuhnya_open_07_daily
  alias: Кухня — шторы открыть ежедневно в 07:00
  mode: single
  triggers:
    - trigger: time
      at: "07:00:00"
  conditions:
    - condition: state
      entity_id: cover.shtory_kuhnya
      state: closed
  actions:
    - action: cover.open_cover
      target:
        entity_id: cover.shtory_kuhnya

- id: curtains_kuhnya_close_at_night
  alias: Кухня — шторы закрыть при темноте
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.day_night
      to: "off"
  conditions:
    - condition: state
      entity_id: cover.shtory_kuhnya
      state: open
  actions:
    - action: cover.close_cover
      target:
        entity_id: cover.shtory_kuhnya

# ====== ЗАЛ ======
- id: curtains_zal_open_07_daily
  alias: Зал — шторы открыть ежедневно в 07:00 (проверка двери)
  mode: single
  triggers:
    - trigger: time
      at: "07:00:00"
  conditions:
    - condition: state
      entity_id: binary_sensor.door_sensor_balkon1_contact
      state: "off"   # дверь балкона закрыта
    - condition: state
      entity_id: cover.shtory_zal
      state: closed
  actions:
    - action: cover.open_cover
      target:
        entity_id: cover.shtory_zal

- id: curtains_zal_close_at_night
  alias: Зал — шторы закрыть при темноте (проверка двери)
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.day_night
      to: "off"
  conditions:
    - condition: state
      entity_id: binary_sensor.door_sensor_balkon1_contact
      state: "off"   # дверь балкона закрыта
    - condition: state
      entity_id: cover.shtory_zal
      state: open
  actions:
    - action: cover.close_cover
      target:
        entity_id: cover.shtory_zal

# ====== СПАЛЬНЯ ======
- id: curtains_spalnya_open_07_weekdays
  alias: Спальня — шторы открыть по будням в 07:00 (проверка двери)
  mode: single
  triggers:
    - trigger: time
      at: "07:00:00"
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: state
      entity_id: binary_sensor.door_sensor_balkon2_contact
      state: "off"   # дверь балкона закрыта
